<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22252a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi coche">
<title>Mi coche</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --asfalto:#22252a;
    --asfalto-2:#2d3137;
    --asfalto-3:#3a3f46;
    --pintura:#f5c518;
    --tiza:#eceae4;
    --senal:#9aa0a8;
    --alerta:#e5533d;
    --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--asfalto);
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:3px 3px;
    color:var(--tiza);font-family:var(--body);font-size:17px;line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  main{max-width:520px;margin:0 auto;padding:20px 18px 32px}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--pintura);outline-offset:2px}

  /* Estado */
  .estado h1{
    font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,12vw,3.6rem);
    line-height:.95;margin:6px 0 6px;letter-spacing:-.01em;
  }
  .estado p{margin:0;color:var(--senal)}
  .estado .vacio{color:var(--tiza)}

  /* Mapa */
  .mapa-wrap{
    margin:18px 0 12px;border-radius:14px;overflow:hidden;position:relative;
    border:2px solid var(--asfalto-3);background:var(--asfalto-2);
  }
  #mapa{height:44vh;min-height:240px;max-height:380px}
  .leaflet-container{background:var(--asfalto-2)}
  .pin{
    width:38px;height:38px;border-radius:8px;background:var(--pintura);color:var(--asfalto);
    font:800 26px/38px var(--display);text-align:center;border:3px solid var(--asfalto);
    box-shadow:0 0 0 2px var(--pintura);
  }
  .yo{width:16px;height:16px;border-radius:50%;background:#4ea1ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(78,161,255,.25)}

  .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--asfalto-3);border-radius:10px;overflow:hidden;margin-bottom:14px}
  .datos div{background:var(--asfalto-2);padding:10px 12px}
  .datos b{display:block;font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1.1}
  .datos span{font-size:.82rem;color:var(--senal)}

  .nota{display:block;margin-bottom:14px}
  .nota span{display:block;font-size:.9rem;color:var(--senal);margin-bottom:4px}
  .nota input{
    width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--asfalto-3);
    background:var(--asfalto-2);
  }
  .nota input::placeholder{color:#6d737b}

  .acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .btn{
    padding:13px 10px;border-radius:10px;border:2px solid var(--tiza);background:transparent;
    font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.01em;
  }
  .btn:active{background:var(--asfalto-3)}
  .btn.ancho{grid-column:1/-1}
  .btn.sutil{border-color:var(--asfalto-3);color:var(--senal);font-size:1.05rem}

  /* La plaza pintada: el botón principal */
  .plaza{
    position:relative;display:block;width:100%;height:150px;margin:6px 0 26px;
    border:none;background:transparent;padding:0;
  }
  .plaza::before{ /* líneas laterales y de fondo de la plaza */
    content:"";position:absolute;inset:0;
    border:6px solid var(--tiza);border-bottom:none;border-radius:2px 2px 0 0;
    opacity:.9;
  }
  .plaza .relleno{
    position:absolute;inset:18px 18px 0;background:var(--pintura);color:var(--asfalto);
    display:flex;align-items:center;justify-content:center;gap:14px;
    border-radius:4px 4px 0 0;transition:transform .15s ease;
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
  }
  .plaza .p{font:800 5rem/1 var(--display)}
  .plaza .txt{font:800 1.9rem/1 var(--display);text-align:left}
  .plaza .txt small{display:block;font:600 1rem/1.3 var(--body);opacity:.75}
  .plaza:active .relleno{transform:translateY(4px)}
  .plaza[aria-busy="true"] .relleno{animation:latido 1s ease-in-out infinite}
  @keyframes latido{50%{opacity:.6}}

  /* Historial */
  details{border-top:2px dashed var(--asfalto-3);padding-top:14px}
  summary{font-family:var(--display);font-weight:700;font-size:1.25rem;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:" +";color:var(--senal)}
  details[open] summary::after{content:" −"}
  #historial{list-style:none;margin:10px 0 0;padding:0}
  #historial li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--asfalto-3)}
  #historial li span{color:var(--senal);font-size:.9rem}
  #historial a{color:var(--pintura);text-decoration:none;font-weight:600;white-space:nowrap}

  /* Brújula */
  .brujula{
    position:fixed;inset:0;z-index:2000;background:var(--asfalto);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;
    padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
    text-align:center;
  }
  .brujula.abierta{display:flex}
  .flecha{width:min(62vw,260px);height:min(62vw,260px);transition:transform .2s linear}
  .brujula .dist{font:800 4.2rem/1 var(--display)}
  .brujula p{margin:0;color:var(--senal);max-width:30ch}

  .toast{
    position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);
    background:var(--tiza);color:var(--asfalto);padding:12px 18px;border-radius:10px;font-weight:600;
    z-index:3000;transition:transform .25s ease;max-width:90vw;
  }
  .toast.ver{transform:translate(-50%,0)}
  .toast.error{background:var(--alerta);color:#fff}
  [hidden]{display:none!important}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<main>
  <section class="estado" aria-live="polite">
    <h1 id="titulo">Mi coche</h1>
    <p id="subtitulo" class="vacio">Aún no has guardado dónde aparcaste.</p>
  </section>

  <div id="bloqueCoche" hidden>
    <div class="mapa-wrap"><div id="mapa" role="img" aria-label="Mapa con la posición del coche"></div></div>

    <div class="datos">
      <div><b id="dHora">–</b><span>aparcado</span></div>
      <div><b id="dPrec">–</b><span>precisión</span></div>
      <div><b id="dDist">–</b><span>de ti</span></div>
    </div>

    <label class="nota">
      <span>Nota</span>
      <input id="nota" type="text" maxlength="80" placeholder="Calle Real, frente a la farmacia">
    </label>

    <div class="acciones">
      <button class="btn" id="bLlevame">Cómo llegar</button>
      <button class="btn" id="bBrujula">Guíame a pie</button>
      <button class="btn sutil" id="bCompartir">Compartir</button>
      <button class="btn sutil" id="bRecogido">Ya lo he cogido</button>
    </div>
  </div>

  <button class="plaza" id="bAparcar" aria-busy="false">
    <span class="relleno">
      <span class="p" aria-hidden="true">P</span>
      <span class="txt">Aparcar aquí<small id="aparcarAyuda">Guarda tu posición actual</small></span>
    </span>
  </button>

  <details id="bloqueHistorial" hidden>
    <summary>Aparcamientos anteriores</summary>
    <ul id="historial"></ul>
  </details>
</main>

<div class="brujula" id="brujula" role="dialog" aria-label="Guía hasta el coche">
  <svg class="flecha" id="flecha" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="47" fill="none" stroke="#3a3f46" stroke-width="3"/>
    <path d="M50 10 L72 62 L50 52 L28 62 Z" fill="#f5c518"/>
  </svg>
  <div class="dist" id="bDist">–</div>
  <p id="bAyuda">Sujeta el móvil en horizontal, con la pantalla hacia arriba.</p>
  <button class="btn" id="bCerrar" style="min-width:180px">Cerrar</button>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const CLAVE = "mi-coche:v1";
  const MAX_HISTORIAL = 15;
  const $ = id => document.getElementById(id);
  const esIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  // ---------- Almacenamiento ----------
  let datos = { actual: null, historial: [] };
  try {
    const raw = localStorage.getItem(CLAVE);
    if (raw) datos = Object.assign(datos, JSON.parse(raw));
  } catch (e) { /* sin almacenamiento: seguimos en memoria */ }
  const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(datos)); } catch (e) {} };

  // ---------- Utilidades ----------
  const rtf = new Intl.RelativeTimeFormat("es", { numeric: "auto" });
  function haceCuanto(ts) {
    const s = Math.round((ts - Date.now()) / 1000);
    const a = Math.abs(s);
    if (a < 60) return "ahora mismo";
    if (a < 3600) return rtf.format(Math.round(s / 60), "minute");
    if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
    return rtf.format(Math.round(s / 86400), "day");
  }
  const horaCorta = ts => new Date(ts).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  const fechaLarga = ts => new Date(ts).toLocaleString("es-ES", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  function metros(m) {
    if (m == null || isNaN(m)) return "–";
    return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(m < 10000 ? 1 : 0).replace(".", ",") + " km";
  }
  const rad = d => d * Math.PI / 180;
  function distancia(a, b) {
    const R = 6371000, dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function rumbo(a, b) {
    const y = Math.sin(rad(b.lon - a.lon)) * Math.cos(rad(b.lat));
    const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lon - a.lon));
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  // Atajos en español pueden mandar "37,1788" con coma decimal
  const num = v => (v == null || v === "") ? NaN : parseFloat(String(v).trim().replace(",", "."));

  let toastT;
  function aviso(msg, error = false) {
    const t = $("toast");
    t.textContent = msg; t.classList.toggle("error", error); t.classList.add("ver");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("ver"), 3200);
  }

  // Obtiene la mejor posición posible durante unos segundos
  function mejorPosicion(maxMs = 9000) {
    return new Promise((resolve, reject) => {
      if (!("geolocation" in navigator)) return reject(new Error("Este navegador no da acceso a la ubicación."));
      let mejor = null;
      const fin = () => {
        navigator.geolocation.clearWatch(id); clearTimeout(t);
        mejor ? resolve(mejor) : reject(new Error("No se ha podido obtener la ubicación. Revisa que el GPS esté activado."));
      };
      const id = navigator.geolocation.watchPosition(p => {
        if (!mejor || p.coords.accuracy < mejor.coords.accuracy) mejor = p;
        if (p.coords.accuracy <= 12) fin();
      }, err => {
        if (err.code === 1) { navigator.geolocation.clearWatch(id); clearTimeout(t);
          reject(new Error("Permiso de ubicación denegado. Actívalo en los ajustes del navegador.")); }
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: maxMs });
      const t = setTimeout(fin, maxMs);
    });
  }

  // ---------- Acciones ----------
  function aparcar(lat, lon, prec, origen) {
    if (datos.actual) {
      datos.historial.unshift(datos.actual);
      datos.historial = datos.historial.slice(0, MAX_HISTORIAL);
    }
    datos.actual = { lat, lon, prec: isNaN(prec) ? null : prec, ts: Date.now(), nota: "", origen };
    guardar(); pintar(true);
    aviso(origen === "auto" ? "Coche guardado automáticamente" : "Coche guardado");
    if (navigator.vibrate) navigator.vibrate(40);
  }

  async function aparcarAqui() {
    const b = $("bAparcar");
    b.setAttribute("aria-busy", "true"); $("aparcarAyuda").textContent = "Buscando señal GPS…";
    try {
      const p = await mejorPosicion();
      aparcar(p.coords.latitude, p.coords.longitude, p.coords.accuracy, "manual");
    } catch (e) { aviso(e.message, true); }
    finally { b.setAttribute("aria-busy", "false"); $("aparcarAyuda").textContent = "Guarda tu posición actual"; }
  }

  function enlaceMapa(c) {
    return esIOS
      ? `https://maps.apple.com/?daddr=${c.lat},${c.lon}&dirflg=w`
      : `https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lon}&travelmode=walking`;
  }

  // ---------- Mapa ----------
  let mapa, marcaCoche, marcaYo, circulo, yo = null;
  function pintarMapa(centrar) {
    const c = datos.actual;
    if (!window.L) { $("mapa").innerHTML = '<p style="padding:16px;color:#9aa0a8">Sin conexión: el mapa no se puede cargar, pero “Cómo llegar” sigue funcionando.</p>'; return; }
    if (!mapa) {
      mapa = L.map("mapa", { zoomControl: false, attributionControl: true }).setView([c.lat, c.lon], 18);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 20, subdomains: "abcd",
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(mapa);
    }
    const icono = L.divIcon({ className: "", html: '<div class="pin">P</div>', iconSize: [38, 38], iconAnchor: [19, 19] });
    if (marcaCoche) { marcaCoche.setLatLng([c.lat, c.lon]); } else { marcaCoche = L.marker([c.lat, c.lon], { icon: icono }).addTo(mapa); }
    if (circulo) mapa.removeLayer(circulo);
    if (c.prec) circulo = L.circle([c.lat, c.lon], { radius: c.prec, color: "#f5c518", weight: 1, fillOpacity: .08 }).addTo(mapa);
    if (centrar) mapa.setView([c.lat, c.lon], 18);
    setTimeout(() => mapa.invalidateSize(), 50);
  }

  function actualizarYo(p) {
    yo = { lat: p.coords.latitude, lon: p.coords.longitude };
    if (datos.actual) $("dDist").textContent = metros(distancia(yo, datos.actual));
    if (mapa && window.L) {
      const icono = L.divIcon({ className: "", html: '<div class="yo"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
      marcaYo ? marcaYo.setLatLng([yo.lat, yo.lon]) : (marcaYo = L.marker([yo.lat, yo.lon], { icon: icono, interactive: false }).addTo(mapa));
    }
  }

  // ---------- Pintar interfaz ----------
  function pintar(centrar = false) {
    const c = datos.actual;
    $("bloqueCoche").hidden = !c;
    if (c) {
      $("titulo").textContent = "Aparcado " + haceCuanto(c.ts);
      $("subtitulo").textContent = c.nota || (c.origen === "auto" ? "Guardado al llegar" : "Guardado a mano");
      $("subtitulo").classList.remove("vacio");
      $("dHora").textContent = horaCorta(c.ts);
      $("dPrec").textContent = c.prec ? "±" + Math.round(c.prec) + " m" : "–";
      $("dDist").textContent = yo ? metros(distancia(yo, c)) : "–";
      if (document.activeElement !== $("nota")) $("nota").value = c.nota || "";
      pintarMapa(centrar);
    } else {
      $("titulo").textContent = "Mi coche";
      $("subtitulo").textContent = "Aún no has guardado dónde aparcaste.";
      $("subtitulo").classList.add("vacio");
    }
    const h = $("historial"); h.innerHTML = "";
    datos.historial.forEach(x => {
      const li = document.createElement("li");
      const izq = document.createElement("div");
      izq.innerHTML = `<div>${fechaLarga(x.ts)}</div>`;
      if (x.nota) { const s = document.createElement("span"); s.textContent = x.nota; izq.appendChild(s); }
      const a = document.createElement("a"); a.href = enlaceMapa(x); a.target = "_blank"; a.rel = "noopener"; a.textContent = "Ver";
      li.append(izq, a); h.appendChild(li);
    });
    $("bloqueHistorial").hidden = datos.historial.length === 0;
  }

  // ---------- Brújula ----------
  let rumboCompas = null, vigilaBrujula = null;
  function orientacion(e) {
    let h = null;
    if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;           // iOS
    else if (e.absolute && typeof e.alpha === "number") h = 360 - e.alpha;               // Android
    if (h != null) { rumboCompas = h; girarFlecha(); }
  }
  function girarFlecha() {
    if (!yo || !datos.actual) return;
    const destino = rumbo(yo, datos.actual);
    const giro = rumboCompas == null ? destino : destino - rumboCompas;
    $("flecha").style.transform = `rotate(${giro}deg)`;
    const d = distancia(yo, datos.actual);
    $("bDist").textContent = metros(d);
    if (d < 15) $("bAyuda").textContent = "Estás al lado. Mira a tu alrededor.";
    else if (rumboCompas == null) $("bAyuda").textContent = "Sin brújula: la flecha apunta respecto al norte (arriba).";
    else $("bAyuda").textContent = "Camina hacia donde apunta la flecha.";
  }
  async function abrirBrujula() {
    try {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        await DeviceOrientationEvent.requestPermission();   // iOS lo pide tras un toque
      }
    } catch (e) {}
    window.addEventListener("deviceorientationabsolute", orientacion, true);
    window.addEventListener("deviceorientation", orientacion, true);
    $("brujula").classList.add("abierta");
    $("bDist").textContent = "–";
    vigilaBrujula = navigator.geolocation.watchPosition(p => { actualizarYo(p); girarFlecha(); },
      () => aviso("No se puede seguir tu posición.", true), { enableHighAccuracy: true, maximumAge: 2000 });
  }
  function cerrarBrujula() {
    $("brujula").classList.remove("abierta");
    window.removeEventListener("deviceorientationabsolute", orientacion, true);
    window.removeEventListener("deviceorientation", orientacion, true);
    if (vigilaBrujula != null) navigator.geolocation.clearWatch(vigilaBrujula);
  }

  // ---------- Eventos ----------
  $("bAparcar").addEventListener("click", aparcarAqui);
  $("bLlevame").addEventListener("click", () => { if (datos.actual) window.open(enlaceMapa(datos.actual), "_blank"); });
  $("bBrujula").addEventListener("click", abrirBrujula);
  $("bCerrar").addEventListener("click", cerrarBrujula);
  $("bCompartir").addEventListener("click", async () => {
    const c = datos.actual; if (!c) return;
    const url = `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lon}`;
    const texto = "Mi coche está aquí" + (c.nota ? ` (${c.nota})` : "");
    try {
      if (navigator.share) await navigator.share({ title: "Mi coche", text: texto, url });
      else { await navigator.clipboard.writeText(`${texto}: ${url}`); aviso("Enlace copiado"); }
    } catch (e) {}
  });
  $("bRecogido").addEventListener("click", () => {
    if (!datos.actual) return;
    datos.historial.unshift(datos.actual); datos.historial = datos.historial.slice(0, MAX_HISTORIAL);
    datos.actual = null; guardar(); pintar(); aviso("Marcado como recogido");
  });
  $("nota").addEventListener("input", e => {
    if (!datos.actual) return;
    datos.actual.nota = e.target.value.trim(); guardar();
    $("subtitulo").textContent = datos.actual.nota || "Guardado";
  });

  // ---------- Entrada desde la automatización ----------
  // ?lat=..&lon=..(&prec=..)  → guarda esas coordenadas
  // ?guardar=1                → pide la ubicación y guarda
  const q = new URLSearchParams(location.search);
  const lat = num(q.get("lat")), lon = num(q.get("lon"));
  let limpiar = false;
  if (!isNaN(lat) && !isNaN(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
    aparcar(lat, lon, num(q.get("prec")), "auto"); limpiar = true;
  } else if (q.get("guardar") === "1") {
    limpiar = true;
    aparcarAqui().then(() => { if (datos.actual) { datos.actual.origen = "auto"; guardar(); pintar(); } });
  }
  if (limpiar) history.replaceState(null, "", location.pathname);   // evita volver a guardar al recargar

  pintar(true);

  // Distancia en segundo plano mientras la app está abierta
  if ("geolocation" in navigator && datos.actual) {
    navigator.geolocation.getCurrentPosition(actualizarYo, () => {}, { enableHighAccuracy: true, maximumAge: 30000, timeout: 10000 });
  }
  // Refresca el "hace X" cada minuto
  setInterval(() => { if (datos.actual) $("titulo").textContent = "Aparcado " + haceCuanto(datos.actual.ts); }, 60000);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
